<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AI Video Studio — player</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { createStudio, loadImages } from "./engine.js";

async function loadFonts() {
  await Promise.all([500, 600, 700, 800, 900].map((w) => document.fonts.load(`${w} 100px Inter`)));
  await Promise.all([400, 700].map((w) => document.fonts.load(`${w} 100px "Liberation Mono"`)));
  await document.fonts.load(`400 100px IPAGothic`, "事件");
  await document.fonts.ready;
}

// Lo usan los scripts de render, sheet y check (vía Playwright).
window.studioInit = async (timeline, style, base = "") => {
  await loadFonts();
  const images = await loadImages(timeline, base);
  const canvas = document.getElementById("c");
  window.studio = createStudio(canvas, timeline, style, images);
  window.studioCanvas = canvas;
  return { totalFrames: window.studio.totalFrames, fps: window.studio.fps, total: window.studio.total };
};

window.studioFrames = (from, to, quality = 0.95) => {
  const out = [];
  for (let f = from; f < to; f++) {
    window.studio.renderFrame(f);
    out.push(window.studioCanvas.toDataURL("image/jpeg", quality));
  }
  return out;
};

// Hoja de contactos: varios instantes en una cuadrícula.
window.studioSheet = (shots, cols = 4, thumbW = 270) => {
  const st = window.studio;
  const thumbH = Math.round(thumbW * st.H / st.W);
  const labelH = 34, gap = 12;
  const rows = Math.ceil(shots.length / cols);
  const sheet = document.createElement("canvas");
  sheet.width = cols * thumbW + (cols + 1) * gap;
  sheet.height = rows * (thumbH + labelH) + (rows + 1) * gap;
  const g = sheet.getContext("2d");
  g.fillStyle = "#222"; g.fillRect(0, 0, sheet.width, sheet.height);
  shots.forEach((s, i) => {
    st.renderAt(s.t);
    const x = gap + (i % cols) * (thumbW + gap);
    const y = gap + Math.floor(i / cols) * (thumbH + labelH + gap);
    g.drawImage(window.studioCanvas, x, y, thumbW, thumbH);
    // zona segura
    g.strokeStyle = "rgba(255,80,80,0.55)"; g.setLineDash([4, 4]); g.lineWidth = 1;
    const k = thumbW / st.W;
    g.strokeRect(x + st.SAFE.left * k, y + st.SAFE.top * k, (st.SAFE.right - st.SAFE.left) * k, (st.SAFE.bottom - st.SAFE.top) * k);
    g.setLineDash([]);
    g.fillStyle = "#ddd"; g.font = "600 18px Inter, sans-serif"; g.textBaseline = "top";
    g.fillText(s.label, x, y + thumbH + 8);
  });
  return sheet.toDataURL("image/png");
};

// Movimiento entre fotogramas (diferencia media de píxeles en miniatura), para encontrar el momento más rápido.
window.studioMotion = (stride = 3) => {
  const st = window.studio, cv = window.studioCanvas;
  const small = document.createElement("canvas"); small.width = 54; small.height = Math.round(54 * cv.height / cv.width);
  const g = small.getContext("2d", { willReadFrequently: true });
  let prev = null; const out = [];
  for (let f = 0; f < st.totalFrames; f += stride) {
    st.renderFrame(f);
    g.drawImage(cv, 0, 0, small.width, small.height);
    const d = g.getImageData(0, 0, small.width, small.height).data;
    if (prev) { let s = 0; for (let i = 0; i < d.length; i += 4) s += Math.abs(d[i] - prev[i]) + Math.abs(d[i + 1] - prev[i + 1]) + Math.abs(d[i + 2] - prev[i + 2]); out.push({ f, v: s / (d.length / 4) }); }
    prev = d;
  }
  return out;
};

window.studioReady = true;
</script>
</body>
</html>
